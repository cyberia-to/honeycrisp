[package]
name = "unimem"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "zero-copy memory driver for Apple Silicon"
repository = "https://github.com/cyberia-to/honeycrisp"
homepage = "https://github.com/cyberia-to/honeycrisp/tree/master/unimem"
keywords = ["apple-silicon", "iosurface", "zero-copy", "arena", "memory"]
categories = ["os::macos-apis", "hardware-support", "memory-management"]
readme = "README.md"
exclude = ["CLAUDE.md", "experiments/"]

[dependencies]
crossbeam-queue.workspace = true
mutants.workspace = true

[dev-dependencies]
criterion.workspace = true
libc.workspace = true
rane.workspace = true
aruminium.workspace = true
acpu.workspace = true

[[example]]
name = "ane_matmul"

[[example]]
name = "pipeline"

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "bandwidth"
harness = false
