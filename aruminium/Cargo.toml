[package]
name = "aruminium"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "pure Rust Apple Metal GPU driver"
repository = "https://github.com/cyberia-to/honeycrisp"
homepage = "https://github.com/cyberia-to/honeycrisp/tree/master/aruminium"
keywords = ["metal", "gpu", "apple-silicon", "compute", "macos"]
categories = ["os::macos-apis", "graphics", "hardware-support"]
readme = "README.md"
exclude = ["CLAUDE.md"]

[dependencies]
unimem.workspace = true
acpu.workspace = true
mutants.workspace = true

[lib]
name = "aruminium"
path = "src/lib.rs"

[[bin]]
name = "metal_probe"
path = "src/probe.rs"

[[example]]
name = "vecadd"
path = "examples/vecadd.rs"

[[example]]
name = "matmul"
path = "examples/matmul.rs"
